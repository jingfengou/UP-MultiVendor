# FAIR fb.resnet.torch ResNet-50 ImageNet recipe using native UP components.
# UP_IMAGENET_ROOT contains train/, val/ and meta/{train,val}.txt in UP format.
# Set UP_FAIR_OUTPUT_ROOT to a fresh AFS run directory.
num_classes: &num_classes 1000
runtime:
  task_names: cls
  platform: nvidia
  expected_world_size: 4
  runner: {type: base}
  fp16: false
  random_seed: 0 # FAIR -manualSeed default.
  rank_init: false
  audit_recipe: true
  dnn: {benchmark: true, allow_tf32: false}

dataset:
  train:
    dataset:
      type: cls
      kwargs:
        meta_file: ${UP_IMAGENET_ROOT}/meta/train.txt
        image_reader:
          type: fs_pillow
          kwargs: {image_dir: "${UP_IMAGENET_ROOT}/train", color_mode: RGB}
        transformer:
        - type: torch_random_resized_crop
          kwargs: {size: 224, scale: [0.08, 1.0], interpolation: bicubic}
        - type: torch_color_jitter
          kwargs: {brightness: 0.4, contrast: 0.4, saturation: 0.4}
        - &to_tensor {type: to_tensor}
        - type: imagenet_pca_lighting
          kwargs: {std: 0.1}
        - &normalize
          type: normalize
          kwargs: {mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - type: torch_random_horizontal_flip
    batch_sampler: &batch_sampler
      type: base
      kwargs:
        sampler: {type: dist, kwargs: {}}
        batch_size: 64 # 4 ranks x 64 images = 256.
    dataloader:
      type: cls_base
      kwargs: {num_workers: 4, pin_memory: true}
  test:
    dataset:
      type: cls
      kwargs:
        meta_file: ${UP_IMAGENET_ROOT}/meta/val.txt
        image_reader:
          type: fs_pillow
          kwargs: {image_dir: "${UP_IMAGENET_ROOT}/val", color_mode: RGB}
        transformer:
        - type: torch_resize
          kwargs: {size: 256, interpolation: bicubic}
        - type: torch_center_crop
          kwargs: {size: 224}
        - *to_tensor
        - *normalize
        evaluator:
          type: imagenet
          kwargs: {topk: [1, 5]}
    batch_sampler: *batch_sampler
    dataloader:
      type: cls_base
      kwargs: {num_workers: 4, pin_memory: false}

trainer:
  max_epoch: 90
  test_freq: 1
  save_freq: 5
  only_save_latest: false
  optimizer:
    type: SGD
    kwargs: {lr: 0.1, momentum: 0.9, weight_decay: 0.0001, nesterov: true}
  lr_scheduler:
    type: MultiStepLR
    warmup_register_type: no_scale_lr
    kwargs: {milestones: [30, 60], gamma: 0.1}
  execution: {scheduler_interval: epoch_end}

saver:
  save_dir: ${UP_FAIR_OUTPUT_ROOT}/checkpoints
  results_dir: ${UP_FAIR_OUTPUT_ROOT}/results
  auto_resume: false
  require_empty: true

hooks:
- type: auto_save_best
- type: auto_save_metric
  kwargs: {metric_json: "${UP_FAIR_OUTPUT_ROOT}/results/metrics.json"}
- type: recipe_audit
net:
- name: backbone
  type: resnet50
  kwargs:
    frozen_layers: []
    out_layers: [4]
    out_strides: [32]
    normalize: {type: solo_bn}
    initializer: {method: msra, mode: fan_out, a: 0}
- name: head
  type: base_cls_head
  kwargs:
    num_classes: *num_classes
    in_plane: 2048
    input_feature_idx: -1
- name: post_process
  type: base_cls_postprocess
  kwargs:
    cls_loss: {type: ce}
export:
  input_size: [3, 224, 224]
  opset: 17
