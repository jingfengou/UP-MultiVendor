# Megvii YOLOX-S COCO recipe (98e6a207) using native UP components.
# UP_COCO_ROOT contains annotations/, train2017/ and val2017/.
# Set UP_MEGVII_YOLOX_OUTPUT_ROOT to a fresh AFS run directory.
num_classes: !include yolox_s.yaml//num_classes
runtime:
  platform: nvidia
  expected_world_size: 4
  runner: {type: base}
  fp16: true
  # Megvii leaves BaseExp.seed unset. Use integer Exp.seed = 0 for the paired run.
  random_seed: 0
  rank_init: false
  audit_recipe: true
  dnn: {benchmark: true, deterministic: true, allow_tf32: false}
  aligned: true
  async_norm: true
  special_bn_init: true
  task_names: det

dataset:
  train:
    dataset:
      type: coco
      kwargs:
        meta_file: ${UP_COCO_ROOT}/annotations/instances_train2017.json
        include_unannotated: true
        image_reader:
          type: fs_opencv
          kwargs: {image_dir: "${UP_COCO_ROOT}/train2017", color_mode: BGR}
        transformer:
        - type: mosaic
          kwargs: {extra_input: true, tar_size: 640, fill_color: 114}
        - type: random_perspective_yolox
          kwargs:
            degrees: 10.0
            translate: 0.1
            scale: [0.1, 2.0]
            shear: 2.0
            perspective: 0.0
            fill_color: 114
            border: [-320, -320]
        - type: yolox_mixup_cv2
          kwargs:
            extra_input: true
            input_size: [640, 640]
            mixup_scale: [0.5, 1.5] # Pinned MosaicDetection's effective default.
            flip_prob: 0.5
            fill_color: 114
        - &hsv !include yolox_s.yaml//augment_hsv
        - &flip !include yolox_s.yaml//flip
        - &train_resize
          type: keep_ar_resize_max
          kwargs: {max_size: 640, padding_type: left_top, padding_val: 114}
        - &to_tensor !include yolox_s.yaml//to_tensor
    batch_sampler: &batch_sampler
      type: base
      kwargs:
        sampler: {type: dist, kwargs: {}}
        batch_size: 16 # 4 ranks x 16 images = 64.
  test:
    dataset:
      type: coco
      kwargs:
        meta_file: &val_annotations "${UP_COCO_ROOT}/annotations/instances_val2017.json"
        include_unannotated: true
        image_reader:
          type: fs_opencv
          kwargs: {image_dir: "${UP_COCO_ROOT}/val2017", color_mode: BGR}
        transformer:
        - type: keep_ar_resize_max
          kwargs: {max_size: 640, padding_type: left_top, padding_val: 114}
        - *to_tensor
        evaluator:
          type: COCO
          kwargs: {gt_file: *val_annotations, iou_types: [bbox], cmp_key: bbox.AP}
    batch_sampler: *batch_sampler
  dataloader:
    type: base
    kwargs: {num_workers: 4, alignment: 32, worker_init: false, pin_memory: true, pad_type: batch_pad, pad_value: 114}

trainer:
  max_epoch: &max_epoch 300
  test_freq: 10
  save_freq: 5
  only_save_latest: false
  optimizer: !include yolox_s.yaml//trainer.optimizer
  lr_scheduler: !include yolox_s.yaml//trainer.lr_scheduler

saver:
  save_dir: ${UP_MEGVII_YOLOX_OUTPUT_ROOT}/checkpoints
  results_dir: ${UP_MEGVII_YOLOX_OUTPUT_ROOT}/results
  auto_resume: false
  require_empty: true

hooks:
- type: yolox_noaug
  kwargs:
    no_aug_epoch: 16 # Pinned trainer disables mosaic at the start of epoch 285.
    max_epoch: *max_epoch
    switch_before_data: true
    save_freq: 5
    transformer: [*hsv, *flip, *train_resize, *to_tensor]
- type: yolox_batch_resize
  kwargs: {input_size: 640, random_size: [14, 26], interval: 10}
- type: auto_save_best
- type: auto_save_metric
  kwargs: {metric_json: "${UP_MEGVII_YOLOX_OUTPUT_ROOT}/results/metrics.json"}
- type: recipe_audit
ema: !include yolox_s.yaml//ema
net: !include yolox_s.yaml//net
export: !include yolox_s.yaml//export
override@:
  trainer.lr_scheduler.warmup_ratio: 0.0
  net.3.kwargs.all_reduce_norm: false
