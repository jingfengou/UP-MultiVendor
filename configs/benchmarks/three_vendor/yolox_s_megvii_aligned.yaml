# Megvii YOLOX-S recipe with UP BaseRunner and registered UP components.
# Run from a fresh output directory containing a `coco` symlink.
num_classes: &num_classes 81
runtime:
  platform: nvidia
  runner: {type: base}
  expected_world_size: 4
  fp16: true
  random_seed: null
  rank_init: false
  dnn: {benchmark: true, deterministic: false, allow_tf32: false}
  aligned: true
  async_norm: true
  ema_async_norm: false
  special_bn_init: true
  task_names: det

dataset:
  train:
    dataset:
      type: coco
      kwargs:
        meta_file: coco/annotations/instances_train2017.json
        include_unannotated: true
        image_reader:
          type: fs_opencv
          kwargs: {image_dir: coco/train2017, color_mode: BGR}
        transformer:
        - type: mosaic
          kwargs: {extra_input: true, tar_size: 640, fill_color: 114}
        - type: yolox_megvii_affine
          kwargs:
            degrees: 10.0
            translate: 0.1
            scale: [0.1, 2.0]
            shear: 2.0
            perspective: 0.0
            fill_color: 114
            border: [-320, -320]
        - type: yolox_mixup_cv2
          kwargs:
            extra_input: true
            input_size: [640, 640]
            mixup_scale: [0.5, 1.5]
            flip_prob: 0.5
            fill_color: 114
            megvii_labels: true
        - &hsv {type: yolox_additive_hsv}
        - &flip {type: flip, kwargs: {flip_p: 0.5}}
        - &train_resize
          type: keep_ar_resize_max
          kwargs: {max_size: 640, padding_type: left_top, padding_val: 114}
        - &to_tensor {type: custom_to_tensor}
    batch_sampler:
      type: base
      kwargs:
        sampler: {type: dist, kwargs: {}}
        batch_size: 16
  test:
    dataset:
      type: coco
      kwargs:
        meta_file: &val_annotations coco/annotations/instances_val2017.json
        include_unannotated: true
        image_reader:
          type: fs_opencv
          kwargs: {image_dir: coco/val2017, color_mode: BGR}
        transformer:
        - type: keep_ar_resize_max
          kwargs: {max_size: 640, padding_type: left_top, padding_val: 114}
        - *to_tensor
        evaluator:
          type: COCO
          kwargs: {gt_file: *val_annotations, iou_types: [bbox], cmp_key: bbox.AP}
    batch_sampler:
      type: base
      kwargs:
        sampler: {type: dist, kwargs: {}}
        batch_size: 16
  dataloader:
    type: base
    kwargs:
      num_workers: 4
      alignment: 32
      worker_init: false
      pin_memory: true
      pad_type: batch_pad
      pad_value: 114

trainer:
  max_epoch: &max_epoch 300
  test_freq: 10
  save_freq: 5
  only_save_latest: false
  optimizer:
    register_type: yolov5
    type: SGD
    kwargs:
      lr: 0.00015625
      momentum: 0.9
      nesterov: true
      weight_decay: 0.0005
  lr_scheduler:
    lr_register_type: yolox_base
    warmup_epochs: 5
    warmup_type: yolox_cos
    type: YoloXCosineLR
    kwargs:
      T_max: *max_epoch
      min_lr_scale: 0.05
      no_aug_epoch: 15
    warmup_ratio: 0.0

saver:
  save_dir: outputs/checkpoints
  results_dir: outputs/results
  auto_resume: false

hooks:
- type: yolox_noaug
  kwargs:
    # UP uses a zero-based iteration threshold; 16 starts at epoch 285.
    no_aug_epoch: 16
    max_epoch: *max_epoch
    switch_before_data: true
    test_freq: 1
    save_freq: 5
    transformer: [*hsv, *flip, *train_resize, *to_tensor]
- type: yolox_batch_resize
  kwargs: {input_size: 640, random_size: [14, 26], interval: 10}
- type: auto_save_best
- type: auto_save_metric
  kwargs: {metric_json: outputs/results/metrics.json}

ema:
  enable: true
  ema_type: exp
  kwargs: {decay: 0.9998}

net:
- name: backbone
  type: yolox_s
  kwargs:
    out_layers: [2, 3, 4]
    out_strides: [8, 16, 32]
    normalize: {type: solo_bn}
    act_fn: {type: Silu}
    focus_type: yolox_focus
- name: neck
  prev: backbone
  type: YoloxPAFPN
  kwargs:
    depth: 0.33
    out_strides: [8, 16, 32]
    act_fn: {type: Silu}
    csp_shortcut: false
- name: roi_head
  prev: neck
  type: YoloXHead
  kwargs:
    num_classes: *num_classes
    width: 0.5
    num_point: 1
    act_fn: {type: Silu}
- name: yolox_post
  prev: roi_head
  type: yolox_post
  kwargs:
    num_classes: *num_classes
    cfg:
      loc_loss:
        type: iou_loss
        kwargs: {loss_type: square_iou, loss_weight: 5.0}
      cls_loss: {type: sigmoid_cross_entropy}
      obj_loss: {type: sigmoid_cross_entropy}
      anchor_generator:
        type: fcos
        kwargs: {dense_points: 1, center: false}
      roi_supervisor:
        type: ota
        kwargs:
          num_classes: *num_classes
          matcher:
            type: ota
            kwargs: {num_classes: *num_classes}
      roi_predictor:
        type: yolox
        kwargs:
          num_classes: *num_classes
          pre_nms_score_thresh: 0.01
          nms: {type: naive, nms_iou_thresh: 0.65}
    all_reduce_norm: false

export:
  input_size: [3, 640, 640]
  opset: 17
