# facebookresearch/detr 29901c51: R50 model-zoo schedule, 42.0 box AP.
# The published run used 8 x 2; this four-device run keeps global batch 16.
expected_world_size: 4
batch_size: 4
evaluation_batch_size: 2
epochs: 500
lr_drop: 400
lr: 0.0001
lr_backbone: 0.00001
weight_decay: 0.0001
clip_max_norm: 0.1
seed: 42
num_workers: 4
backbone: resnet50
dilation: false
position_embedding: sine
enc_layers: 6
dec_layers: 6
dim_feedforward: 2048
hidden_dim: 256
dropout: 0.1
nheads: 8
num_queries: 100
pre_norm: false
aux_loss: true
set_cost_class: 1
set_cost_bbox: 5
set_cost_giou: 2
bbox_loss_coef: 5
giou_loss_coef: 2
eos_coef: 0.1
dataset_file: coco
masks: false
