# Shared UP ResNet50 model and evaluation components.
# Included by the single maintained FAIR-aligned benchmark recipe.
num_classes: 1000

random_horizontal_flip:
  type: torch_random_horizontal_flip

center_crop:
  type: torch_center_crop
  kwargs:
    size: 224

to_tensor:
  type: to_tensor

normalize:
  type: normalize
  kwargs:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

dataset:
  train:
    dataloader:
      type: cls_base
      kwargs:
        num_workers: 4
        pin_memory: true
  test:
    dataset:
      kwargs:
        evaluator:
          type: imagenet
          kwargs:
            topk: [1, 5]
    dataloader:
      type: cls_base
      kwargs:
        num_workers: 4
        pin_memory: false

net:
- name: backbone
  type: resnet50
  kwargs:
    frozen_layers: []
    out_layers: [4]
    out_strides: [32]
    normalize: {type: solo_bn}
    initializer: {method: msra}
- name: head
  type: base_cls_head
  kwargs:
    num_classes: 1000
    in_plane: 2048
    input_feature_idx: -1

export:
  input_size: [3, 224, 224]
  opset: 17
