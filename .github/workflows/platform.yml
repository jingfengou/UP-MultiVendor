name: Package and CLI
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      YOLO_CONFIG_DIR: /tmp/up-yolo-settings
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install matching CPU Torch and application dependencies
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements/export.txt
          python -m pip install --no-deps -r requirements/yolo11.txt
          python -m pip install --no-deps -e .
          mkdir -p "$YOLO_CONFIG_DIR/Ultralytics"
      - name: Check Python sources and CLI entry points
        run: |
          python -m compileall -q up tools
          python -m up --help
          python -m up train --help
          python -m up inference --help
          python -m up to_onnx --help
          python tools/prepare_training_init.py --help
          python -m up yolo26 --help
          python tools/run_yolo26.py --help
      - name: Load public YAML configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from up.utils.general.yaml_loader import load_yaml
          # Syntax-only bindings; this job does not load official models or data.
          for key in ('YOLO26_DETECT_SOURCE', 'YOLO26_CLASSIFY_SOURCE', 'DETR_SOURCE',
                      'COCO_ROOT', 'COCO_YOLO_YAML', 'IMAGENET_ROOT', 'OBJECTS365_WEIGHTS'):
              os.environ[key] = '/tmp/up-config-check/' + key.lower()
          for path in sorted(Path('configs').rglob('*.yaml')):
              config = load_yaml(str(path))
              assert isinstance(config, dict), path
              print(path)
          PY
      - name: Check model plugin registration
        run: |
          DEFAULT_TASKS=cls:det python - <<'PY'
          import torch
          import up
          from up.utils.general.registry_factory import (
              MODULE_ZOO_REGISTRY, DATA_BUILDER_REGISTY, INFERENCER_REGISTRY)
          from up.utils.model.optimizer_helper import BaseOptimizer
          from up.tasks.det.plugins.yolo26.utils.optimizer_helper import YOLO26Optimizer
          for name, plugin in [('official_yolo26', 'yolo26'), ('official_detr', 'detr')]:
              for registry in (MODULE_ZOO_REGISTRY, DATA_BUILDER_REGISTY, INFERENCER_REGISTRY):
                  assert registry[name].__module__.startswith('up.tasks.det.plugins.' + plugin + '.')
          assert YOLO26Optimizer.build_optimizer is BaseOptimizer.build_optimizer
          assert not torch.cuda.is_initialized()
          PY
      - name: Public wheel build without CUDA
        run: |
          python -m pip wheel --no-deps . -w /tmp/up-wheels
          python -m pip install --no-deps --target /tmp/up-wheel-install /tmp/up-wheels/up-*.whl
          cd /tmp
          PYTHONPATH=/tmp/up-wheel-install python -c "import pathlib, torch, up; from up.runtime import setup_runtime; assert str(pathlib.Path(up.__file__)).startswith('/tmp/up-wheel-install/'); r = setup_runtime({'runtime': {'platform': 'metax_cuda'}}, purpose='inference'); assert len(r.native_ops.capabilities()) == 16; assert not torch.cuda.is_initialized()"
